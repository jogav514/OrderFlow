services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orderflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-OrderFlow_Dev_2026!}"
    ports:
      - "${MSSQL_PORT:-14335}:1433"
    volumes:
      - orderflow_sqldata:/var/opt/mssql
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-orderflow}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-OrderFlow_Rmq_2026!}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - orderflow_rabbitmqdata:/var/lib/rabbitmq
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  orders-api:
    build:
      context: .
      dockerfile: Orders.Api/Dockerfile
    container_name: orderflow-orders-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderFlow_OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-OrderFlow_Dev_2026!};Encrypt=False;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USER:-orderflow}"
      RabbitMq__Password: "${RABBITMQ_PASS:-OrderFlow_Rmq_2026!}"
    ports:
      - "${ORDERS_API_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderflow-net

  inventory-worker:
    build:
      context: .
      dockerfile: Inventory.Worker/Dockerfile
    container_name: orderflow-inventory-worker
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderFlow_InventoryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-OrderFlow_Dev_2026!};Encrypt=False;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USER:-orderflow}"
      RabbitMq__Password: "${RABBITMQ_PASS:-OrderFlow_Rmq_2026!}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderflow-net

  frontend:
    build:
      context: ./orderflow.web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:5080}"
    container_name: orderflow-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - orders-api
    networks:
      - orderflow-net

networks:
  orderflow-net:
    name: orderflow-net
    driver: bridge

volumes:
  orderflow_sqldata:
    name: orderflow_sqldata
  orderflow_rabbitmqdata:
    name: orderflow_rabbitmqdata